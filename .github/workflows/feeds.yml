name: feeds
on:
  schedule:
    - cron: '17 1-23/2 * * *'  # co 2 h (nieparzyste godziny UTC); GitHub bywa spozniony, wiec research zawsze ma plik sprzed 2-3 h
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python fetch_feeds.py && python digest.py
      - run: |
          git config user.name "technoglobal-feeds"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/latest.json feeds/digest.json
          git diff --cached --quiet || git commit -m "feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
